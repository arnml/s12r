<!doctype html>
<html lang="es-US">
  <head>
    <meta charset="UTF-8" />
    <title>s12r</title>
    <link rel="stylesheet" href="index.css" />
    <script type="module" src="/src/renderer.ts"></script>
  </head>

  <body>
    <canvas id="bg-particles"></canvas>
    <button id="settingsBtn" class="btn btn-secondary settings-icon-btn">⚙️</button>

    <!-- Floating Settings Modal -->
    <div id="settings-modal" class="settings-modal hidden">
      <div class="settings-modal-content">
        <div class="settings-modal-header">
          <h2>Settings</h2>
          <button id="settings-close-btn" class="settings-close-btn">×</button>
        </div>

        <form id="settings-form" class="settings-form-floating">
          <!-- Mouse Dwell Section -->
          <section class="settings-section-floating">
            <h3>Mouse Dwell Detection</h3>
            <div class="setting-row-floating">
              <label for="dwellThresholdPx">Threshold Radius (px)</label>
              <input type="number" id="dwellThresholdPx" name="dwellThresholdPx" min="5" max="100" step="1" required />
            </div>
            <div class="setting-row-floating">
              <label for="dwellTimeMs">Trigger Time (ms)</label>
              <input type="number" id="dwellTimeMs" name="dwellTimeMs" min="100" max="5000" step="100" required />
            </div>
          </section>

          <!-- Typing Detection Section -->
          <section class="settings-section-floating">
            <h3>Typing Detection</h3>
            <div class="setting-row-floating">
              <label for="typingGapMs">Max Keypress Gap (ms)</label>
              <input type="number" id="typingGapMs" name="typingGapMs" min="100" max="5000" step="100" required />
            </div>
            <div class="setting-row-floating">
              <label for="typingTriggerMs">Trigger Duration (ms)</label>
              <input type="number" id="typingTriggerMs" name="typingTriggerMs" min="500" max="10000" step="100" required />
            </div>
          </section>

          <!-- Zoom Levels Section -->
          <section class="settings-section-floating">
            <h3>Zoom Levels</h3>
            <div class="setting-row-floating">
              <label for="typingZoomLevel">Typing Zoom</label>
              <input type="number" id="typingZoomLevel" name="typingZoomLevel" min="1.0" max="5.0" step="0.1" required />
            </div>
            <div class="setting-row-floating">
              <label for="dwellZoomLevel">Dwell Zoom</label>
              <input type="number" id="dwellZoomLevel" name="dwellZoomLevel" min="1.0" max="5.0" step="0.1" required />
            </div>
          </section>

          <!-- Transition Effects Section -->
          <section class="settings-section-floating">
            <h3>Transition Effects</h3>
            <div class="setting-row-floating">
              <label for="transitionStyle">Style</label>
              <select id="transitionStyle" name="transitionStyle" required>
                <option value="eased">Eased (Default)</option>
                <option value="linear">Linear</option>
              </select>
            </div>
            <div class="setting-row-floating">
              <label for="transitionDurationMs">Duration (ms)</label>
              <input type="number" id="transitionDurationMs" name="transitionDurationMs" min="100" max="2000" step="50" required />
            </div>
          </section>

          <!-- Event Filtering Section -->
          <section class="settings-section-floating">
            <h3>Event Filtering</h3>
            <div class="setting-row-floating">
              <label for="minEventDurationMs">Min Duration (ms)</label>
              <input type="number" id="minEventDurationMs" name="minEventDurationMs" min="0" max="10000" step="100" required />
            </div>
          </section>

          <!-- Action Buttons -->
          <div class="settings-actions-floating">
            <button type="button" id="reset-btn" class="btn btn-secondary">Reset</button>
            <button type="submit" class="btn btn-primary">Save</button>
          </div>

          <div id="error-message" class="error-message hidden"></div>
          <div id="success-message" class="success-message hidden"></div>
        </form>
      </div>
    </div>

    <main class="app-container">
      <header>
        <h1>ScreenRecorder s12r</h1>
      </header>

      <div class="video-wrapper">
        <video></video>
      </div>

      <div class="controls">
        <button id="startBtn" class="btn btn-primary" disabled>Start Recording</button>
        <button id="stopBtn" class="btn btn-danger" disabled>Stop</button>
      </div>

      <div class="source-selection">
        <button id="videoSelectBtn" class="btn btn-secondary">
          Choose Video Source
        </button>
      </div>
    </main>
  </body>
</html>
